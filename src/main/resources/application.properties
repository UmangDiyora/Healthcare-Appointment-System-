# ========================================
# Healthcare Appointment System Configuration
# HIPAA-Compliant Application
# ========================================

# Application Info
spring.application.name=Healthcare Appointment System
server.port=8080

# ========================================
# Database Configuration (PostgreSQL)
# ========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/healthcare_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ========================================
# Redis Configuration
# ========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000

# ========================================
# Security & JWT Configuration
# ========================================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000

# Encryption Key for PHI Data (AES-256)
encryption.secret.key=${ENCRYPTION_SECRET_KEY:0123456789ABCDEF0123456789ABCDEF}

# ========================================
# OAuth2 Configuration (Google)
# ========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/callback/{registrationId}

# OAuth2 Provider
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://www.googleapis.com/oauth2/v4/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# OAuth2 Redirect URLs
app.oauth2.authorized-redirect-uris=http://localhost:3000/oauth2/redirect,http://localhost:8080/oauth2/redirect

# ========================================
# Twilio Configuration (Video & SMS)
# ========================================
twilio.account.sid=${TWILIO_ACCOUNT_SID:your-account-sid}
twilio.api.key=${TWILIO_API_KEY:your-api-key}
twilio.api.secret=${TWILIO_API_SECRET:your-api-secret}
twilio.phone.number=${TWILIO_PHONE_NUMBER:your-twilio-number}

# ========================================
# AWS S3 Configuration
# ========================================
aws.access.key.id=${AWS_ACCESS_KEY_ID:your-access-key}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY:your-secret-key}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:healthcare-medical-records}

# ========================================
# Email Configuration (SMTP)
# ========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:noreply@healthcare.com}

# ========================================
# File Upload Configuration
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========================================
# Logging Configuration
# ========================================
logging.level.root=INFO
logging.level.com.healthcare=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/healthcare-app.log
logging.file.max-size=10MB
logging.file.max-history=30

# ========================================
# Actuator Configuration (Monitoring)
# ========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=true
management.health.db.enabled=true

# ========================================
# OpenAPI / Swagger Documentation
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ========================================
# Session Management
# ========================================
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# ========================================
# CORS Configuration
# ========================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.exposed-headers=Authorization
app.cors.allow-credentials=true
app.cors.max-age=3600

# ========================================
# Application Settings
# ========================================
app.appointment.reminder.hours=24
app.appointment.slot.duration=30
app.audit.log.retention.years=7
app.medical.record.retention.years=7
